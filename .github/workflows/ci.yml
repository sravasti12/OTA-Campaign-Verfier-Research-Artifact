name: Offline simulation verification
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12', '3.13', '3.14']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      LANGSMITH_TRACING: 'false'
      LANGCHAIN_TRACING_V2: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install project and test dependencies
        run: python -m pip install -e ".[dev,shared]"
      - name: Fetch checksum-pinned model checker
        run: python tools/fetch_tools.py
      - name: Research toolchain smoke run
        run: python run_all.py --smoke --require-tlc
      - name: Complete offline regression suite
        run: python -m pytest -q --junitxml=runs/pytest.xml
      - name: Create report directory
        run: python -c "from pathlib import Path; Path('runs').mkdir(exist_ok=True)"
      - name: Evaluate frozen reference fixtures and core oracle
        run: python -m ota_verifier.benchmark.runner --mode fixtures --split all --fail-on-findings --output runs/benchmark.json
      - name: Rehearse release demos and verified recovery
        run: python -m ota_verifier.release_validation --output runs/release
      - name: Record complete dependency environment
        run: python -m pip freeze --exclude-editable > runs/environment.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-${{ matrix.os }}-py${{ matrix.python }}
          path: |
            runs/
            results/raw/smoke/
          if-no-files-found: warn
