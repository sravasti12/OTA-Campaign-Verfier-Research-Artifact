# Copy to .streamlit/secrets.toml on the trusted host; never commit real secrets.
# Register this exact development callback with your OIDC provider.
[auth]
redirect_uri = "http://localhost:8501/oauth2callback"
cookie_secret = "REPLACE_WITH_A_LONG_RANDOM_SECRET"
client_id = "REPLACE_WITH_PROVIDER_CLIENT_ID"
client_secret = "REPLACE_WITH_PROVIDER_CLIENT_SECRET"
server_metadata_url = "https://YOUR-ISSUER.example/.well-known/openid-configuration"
